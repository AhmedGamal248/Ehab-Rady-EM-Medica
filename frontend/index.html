<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/web-logo.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EM Medica — trusted medical supplies and equipment. Browse professional-grade devices, monitoring tools, and nursing supplies with fast delivery." />
    <meta name="theme-color" content="#0d6e8c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07141f" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="EM Medica — Medical Supplies Store" />
    <meta property="og:description" content="Professional medical equipment and supplies. Clear pricing, fast delivery, specialized support." />
    <meta property="og:image"       content="/web-logo.png" />

    <title>EM Medica</title>

    <!-- Preconnect — eliminates DNS + TLS handshake latency for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Font strategy:
      - display=swap: render with fallback font immediately, swap when ready
      - Only the weights we actually use (600, 700, 800 for Manrope; 400, 600, 700, 800 for Cairo)
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@600;700;800&display=swap"
    />

    <!--
      Critical inline CSS:
      Prevents flash of unstyled content (FOUC) before React hydrates.
      Mirrors the CSS custom properties for the loader spinner.
    -->
    <style>
      :root { --loader-primary: #0d6e8c; --loader-bg: #f2f7fa; }
      @media (prefers-color-scheme: dark) {
        :root { --loader-primary: #5ecff0; --loader-bg: #07141f; }
      }
      *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        background: var(--loader-bg);
        color: #142c3e;
        font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #e8f5ff; }
      }
      /* Loading spinner — visible until React mounts */
      .app-loader {
        align-items: center;
        display: flex;
        height: 100vh;
        justify-content: center;
      }
      .app-loader__spinner {
        animation: spin 0.75s linear infinite;
        border: 3px solid rgba(13,110,140,0.15);
        border-radius: 50%;
        border-top-color: var(--loader-primary);
        height: 40px;
        width: 40px;
      }
      @media (prefers-color-scheme: dark) {
        .app-loader__spinner { border-color: rgba(94,207,240,0.15); border-top-color: var(--loader-primary); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .app-loader__spinner { animation: none; border-style: dashed; }
      }
    </style>
  </head>

  <body>
    <!-- Skip-to-content handled by React (in App.jsx) -->
    <div id="root">
      <!-- Server-side placeholder — replaced by React on mount -->
      <div class="app-loader" aria-label="Loading EM Medica" role="status">
        <div class="app-loader__spinner"></div>
      </div>
    </div>

    <!-- Main entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
